workflows:
  aizu-native-ios-release:
    name: aizu (Native) iOS Release
    max_build_duration: 30
    integrations:
      app_store_connect: oddiro_asc_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yutaXXX.aizu
      vars:
        XCODE_SCHEME: "App"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew list xcodegen &>/dev/null || brew install xcodegen

      - name: Generate Xcode project from project.yml (SPM dependencies resolved automatically)
        script: |
          xcodegen generate

      - name: Set build number from Codemagic build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = $PROJECT_BUILD_NUMBER;/" App.xcodeproj/project.pbxproj || true

      - name: Apply fetched signing files to Xcode project
        script: |
          xcode-project use-profiles

      - name: Build ipa for App Store
        script: |
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        beta_groups:
          - App Store Connect Users
