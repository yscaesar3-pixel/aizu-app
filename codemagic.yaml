workflows:
  aizu-native-ios-release:
    name: aizu (Native) iOS Release
    max_build_duration: 30
    integrations:
      app_store_connect: oddiro_asc_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yutaXXX.aizu
      vars:
        XCODE_SCHEME: "App"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew list xcodegen &>/dev/null || brew install xcodegen

      - name: Generate Xcode project from project.yml (SPM dependencies resolved automatically)
        script: |
          xcodegen generate

      - name: DEBUG - verify Info.plist / device family settings were applied to the generated project
        script: |
          echo "----- GENERATE_INFOPLIST_FILE -----"
          grep "GENERATE_INFOPLIST_FILE" App.xcodeproj/project.pbxproj || echo "(not found)"
          echo "----- INFOPLIST_FILE -----"
          grep "INFOPLIST_FILE" App.xcodeproj/project.pbxproj || echo "(not found)"
          echo "----- TARGETED_DEVICE_FAMILY -----"
          grep "TARGETED_DEVICE_FAMILY" App.xcodeproj/project.pbxproj || echo "(not found)"

      - name: Set build number AND marketing version explicitly (force via sed, do not rely on project.yml alone)
        script: |
          # 過去のCapacitor版ビルド(最大11)を必ず上回るよう+100のオフセットを付ける
          BUILD_NUMBER=$((100 + PROJECT_BUILD_NUMBER))
          echo "Using build number: $BUILD_NUMBER"
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/" App.xcodeproj/project.pbxproj
          sed -i '' "s/MARKETING_VERSION = .*/MARKETING_VERSION = 2.0;/" App.xcodeproj/project.pbxproj
          echo "----- Confirm values after sed -----"
          grep "CURRENT_PROJECT_VERSION\|MARKETING_VERSION" App.xcodeproj/project.pbxproj

      - name: Apply fetched signing files to Xcode project
        script: |
          xcode-project use-profiles

      - name: Build ipa for App Store
        script: |
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "$XCODE_SCHEME"

      - name: DEBUG - dump the actually-compiled Info.plist from the built IPA
        script: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Inspecting: $IPA_PATH"
          rm -rf /tmp/ipa_inspect && mkdir -p /tmp/ipa_inspect
          unzip -q "$IPA_PATH" -d /tmp/ipa_inspect
          APP_PATH=$(find /tmp/ipa_inspect/Payload -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP_PATH"
          echo "----- Compiled Info.plist (converted to XML) -----"
          plutil -convert xml1 -o - "$APP_PATH/Info.plist"
          echo "----------------------------------------------------"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        beta_groups:
          - App Store Connect Users
