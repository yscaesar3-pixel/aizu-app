workflows:
  aizu-native-ios-release:
    name: aizu (Native) iOS Release
    max_build_duration: 30
    integrations:
      app_store_connect: oddiro_asc_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yutaXXX.aizu
      vars:
        XCODE_SCHEME: "App"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew list xcodegen &>/dev/null || brew install xcodegen

      - name: Generate Xcode project from project.yml (SPM dependencies resolved automatically)
        script: |
          xcodegen generate

      - name: Set build number from Codemagic build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = $PROJECT_BUILD_NUMBER;/" App.xcodeproj/project.pbxproj || true

      - name: Apply fetched signing files to Xcode project
        script: |
          xcode-project use-profiles

      - name: Build ipa for App Store
        script: |
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "$XCODE_SCHEME"

      - name: DEBUG - dump the actually-compiled Info.plist from the built IPA
        script: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Inspecting: $IPA_PATH"
          rm -rf /tmp/ipa_inspect && mkdir -p /tmp/ipa_inspect
          unzip -q "$IPA_PATH" -d /tmp/ipa_inspect
          APP_PATH=$(find /tmp/ipa_inspect/Payload -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP_PATH"
          echo "----- Compiled Info.plist (converted to XML) -----"
          plutil -convert xml1 -o - "$APP_PATH/Info.plist"
          echo "----------------------------------------------------"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        beta_groups:
          - App Store Connect Users
