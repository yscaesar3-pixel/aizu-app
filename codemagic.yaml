workflows:
  aizu-native-ios-release:
    name: aizu (Native) iOS Release
    max_build_duration: 30
    integrations:
      app_store_connect: oddiro_asc_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yutaXXX.aizu
      vars:
        XCODE_SCHEME: "App"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew list xcodegen &>/dev/null || brew install xcodegen

      - name: Generate Xcode project from project.yml (SPM dependencies resolved automatically)
        script: |
          xcodegen generate

      - name: DEBUG - verify Info.plist / device family settings were applied to the generated project
        script: |
          echo "----- GENERATE_INFOPLIST_FILE -----"
          grep "GENERATE_INFOPLIST_FILE" App.xcodeproj/project.pbxproj || echo "(not found)"
          echo "----- INFOPLIST_FILE -----"
          grep "INFOPLIST_FILE" App.xcodeproj/project.pbxproj || echo "(not found)"
          echo "----- TARGETED_DEVICE_FAMILY -----"
          grep "TARGETED_DEVICE_FAMILY" App.xcodeproj/project.pbxproj || echo "(not found)"

      - name: Set build number AND marketing version explicitly (force via sed, do not rely on project.yml alone)
        script: |
          # 過去のCapacitor版ビルド(最大11)を必ず上回るよう+100のオフセットを付ける
          BUILD_NUMBER=$((100 + PROJECT_BUILD_NUMBER))
          echo "Using build number: $BUILD_NUMBER"
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/" App.xcodeproj/project.pbxproj
          sed -i '' "s/MARKETING_VERSION = .*/MARKETING_VERSION = 2.0;/" App.xcodeproj/project.pbxproj
          echo "----- Confirm values after sed -----"
          grep "CURRENT_PROJECT_VERSION\|MARKETING_VERSION" App.xcodeproj/project.pbxproj

      - name: Apply fetched signing files to Xcode project
        script: |
          xcode-project use-profiles

      - name: Archive (separately, so we can patch the version afterward)
        script: |
          mkdir -p build/ios/xcarchive
          xcodebuild -project "App.xcodeproj" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM=ACYAZKU7GH \
            'CODE_SIGN_IDENTITY=Apple Distribution' \
            CODE_SIGN_STYLE=Manual \
            'OTHER_LDFLAGS=-ObjC' \
            archive

      - name: Add our custom Info.plist keys into the archived .app one by one (PlistBuddy's Merge command silently stopped after the first duplicate key and never added anything - confirmed via logs)
        script: |
          APP_PATH="build/ios/xcarchive/App.xcarchive/Products/Applications/App.app"
          PLIST="$APP_PATH/Info.plist"
          PB="/usr/libexec/PlistBuddy"

          echo "----- Before adding keys -----"
          plutil -convert xml1 -o - "$PLIST"

          "$PB" -c "Add :CFBundleDisplayName string 合図！！" "$PLIST"
          "$PB" -c "Add :UILaunchScreen dict" "$PLIST"
          "$PB" -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          "$PB" -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          "$PB" -c "Add :UIRequiresFullScreen bool true" "$PLIST"
          "$PB" -c "Add :UIViewControllerBasedStatusBarAppearance bool true" "$PLIST"
          "$PB" -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          "$PB" -c "Add :GADApplicationIdentifier string ca-app-pub-8174756915786797~4913065225" "$PLIST"
          "$PB" -c "Add :NSUserTrackingUsageDescription string 広告を最適化するために使用します。" "$PLIST"
          "$PB" -c "Add :SKAdNetworkItems array" "$PLIST"

          SKAD_IDS=(cstr6suwn9 4fzdc2evr5 2fnua5tdw4 ydx93a7ass p78axxw29g v72qych5uu \
            ludvb6z3bs cp8zw746q7 3sh42y64q3 c6k4g5qg8m s39g8k73mm wg4vff78zm \
            3qy4746246 f38h382jlk hs6bdukanm mlmmfzh3r3 v4nxqhlyqp wzmmz9fp6w \
            su67r6k2v3 yclnxrl5pm t38b2kh725 7ug5zh24hu gta9lk7p23 vutu7akeur \
            y5ghdn5j9k v9wttpbfk9 n38lu8286q 47vhws6wlr kbd757ywx3 9t245vhmpl \
            a2p9lx4jpn 22mmun2rn5 44jx6755aq k674qkevps 4468km3ulz 2u9pt9hc89 \
            8s468mfl3y klf5c3l5u5 ppxm28t8ap kbmxgpxpgc uw77j35x4d 578prtvx9j \
            4dzt52r2t5 tl55sbb4fm c3frkrj4fj e5fvkxwrpn 8c4e2ghe7u 3rd42ekr43 \
            97r2b46745 3qcr597p9d)

          i=0
          for id in "${SKAD_IDS[@]}"; do
            "$PB" -c "Add :SKAdNetworkItems:$i dict" "$PLIST"
            "$PB" -c "Add :SKAdNetworkItems:$i:SKAdNetworkIdentifier string ${id}.skadnetwork" "$PLIST"
            i=$((i+1))
          done

          echo "----- After adding keys ($i SKAdNetworkItems entries added) -----"
          plutil -convert xml1 -o - "$PLIST"

      - name: Force-patch CFBundleVersion / CFBundleShortVersionString directly in the archived .app (bypasses whatever is breaking Xcode's own substitution)
        script: |
          BUILD_NUMBER=$((100 + PROJECT_BUILD_NUMBER))
          ARCHIVE_INFO_PLIST="build/ios/xcarchive/App.xcarchive/Info.plist"
          APP_PATH="build/ios/xcarchive/App.xcarchive/Products/Applications/App.app"

          # 1) .app本体のInfo.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 2.0" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP_PATH/Info.plist"

          # 2) .xcarchiveトップレベルのInfo.plist内、ApplicationPropertiesのキャッシュ値
          #    (App Store Connectへのアップロード時、こちらが実際に参照されている可能性が高い)
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:CFBundleShortVersionString 2.0" "$ARCHIVE_INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:CFBundleVersion $BUILD_NUMBER" "$ARCHIVE_INFO_PLIST"

          echo "----- Patched values (.app) -----"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist"
          echo "----- Patched values (.xcarchive ApplicationProperties) -----"
          /usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleShortVersionString" "$ARCHIVE_INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleVersion" "$ARCHIVE_INFO_PLIST"

      - name: Export ipa from the patched archive
        script: |
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/ios/xcarchive/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$HOME/export_options.plist"

      - name: DEBUG - dump the Info.plist INSIDE THE ARCHIVE (before IPA export/repackaging)
        script: |
          ARCHIVE_PATH="build/ios/xcarchive/App.xcarchive"
          APP_PATH="$ARCHIVE_PATH/Products/Applications/App.app"
          echo "----- Archive's Info.plist (CFBundleVersion / CFBundleShortVersionString only) -----"
          plutil -extract CFBundleShortVersionString xml1 -o - "$APP_PATH/Info.plist"
          plutil -extract CFBundleVersion xml1 -o - "$APP_PATH/Info.plist"
          echo "----------------------------------------------------"

      - name: DEBUG - dump the actually-compiled Info.plist from the built IPA
        script: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Inspecting: $IPA_PATH"
          rm -rf /tmp/ipa_inspect && mkdir -p /tmp/ipa_inspect
          unzip -q "$IPA_PATH" -d /tmp/ipa_inspect
          APP_PATH=$(find /tmp/ipa_inspect/Payload -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP_PATH"
          echo "----- Compiled Info.plist (converted to XML) -----"
          plutil -convert xml1 -o - "$APP_PATH/Info.plist"
          echo "----------------------------------------------------"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        beta_groups:
          - App Store Connect Users
